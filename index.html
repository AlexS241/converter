<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP4 в MP3</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16201c;--mute:#5d6b65;--line:#d5dcd8;--acc:#0f766e;--accInk:#fff;--bad:#b42318;--ok:#0f766e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1513;--card:#182320;--ink:#e8efec;--mute:#93a39b;--line:#2b3a35;--acc:#2dd4bf;--accInk:#06201c;--bad:#f97066;--ok:#2dd4bf}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 20px 60px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
p.sub{margin:0 0 24px;color:var(--mute)}
#drop{display:block;border:2px dashed var(--line);border-radius:12px;background:var(--card);padding:36px 20px;text-align:center;cursor:pointer}
#drop:hover,#drop.over,#drop:focus-within{border-color:var(--acc)}
#drop strong{display:block;font-size:18px;margin-bottom:4px}
#drop span{color:var(--mute);font-size:14px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}
select,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button{cursor:pointer}
button.primary{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.st{font-size:14px;color:var(--mute);white-space:nowrap}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}
progress{width:100%;height:6px;margin-top:8px;accent-color:var(--acc)}
#msg{color:var(--mute);font-size:14px;min-height:21px}
a.dl{color:var(--acc);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Конвертер MP4 в MP3</h1>
<p class="sub">Всё работает в вашем браузере. Файлы никуда не загружаются.</p>

<label id="drop">
  <input type="file" id="file" accept="video/*,audio/*,.mp4,.mov,.mkv,.webm,.m4a" multiple>
  <strong>Выберите файлы или перетащите их сюда</strong>
  <span>Можно сразу несколько</span>
</label>

<div class="row">
  <button class="primary" id="go" disabled>Конвертировать</button>
  <button id="zip" disabled>Скачать всё в ZIP</button>
</div>

<p id="msg"></p>
<ul id="list"></ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const fileInput = $('file'), drop = $('drop'), list = $('list'), go = $('go'), zipBtn = $('zip'), msg = $('msg');

let queue = [];            // {file, li, bar, st, blob, outName}
let ffmpeg = null, loaded = false, busy = false;

function addFiles(files){
  for (const f of files){
    const li = document.createElement('li');
    li.innerHTML = '<div class="top"><span class="name"></span><span class="st">В очереди</span></div><progress max="100" value="0" hidden></progress>';
    li.querySelector('.name').textContent = f.name;
    list.appendChild(li);
    queue.push({file:f, li, bar:li.querySelector('progress'), st:li.querySelector('.st'), blob:null,
                outName:f.name.replace(/\.[^.]+$/,'') + '.mp3'});
  }
  go.disabled = busy || !queue.some(q => !q.blob);
}

fileInput.addEventListener('change', e => { addFiles(e.target.files); fileInput.value=''; });
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => {e.preventDefault(); drop.classList.add('over');}));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => {e.preventDefault(); drop.classList.remove('over');}));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

async function init(){
  if (loaded) return;
  const { FFmpeg } = FFmpegWASM;
  const { toBlobURL } = FFmpegUtil;
  const hosts = [
    ['https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd', 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm'],
    ['https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd', 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm'],
  ];
  msg.textContent = 'Подготовка к конвертации…';
  let lastErr;
  for (const [lib, core] of hosts){
    try {
      const inst = new FFmpeg();
      inst.on('log', ({message}) => console.log('[ffmpeg]', message));
      await inst.load({
        classWorkerURL: await toBlobURL(lib + '/814.ffmpeg.js', 'text/javascript'),
        coreURL: await toBlobURL(core + '/ffmpeg-core.js', 'text/javascript'),
        wasmURL: await toBlobURL(core + '/ffmpeg-core.wasm', 'application/wasm'),
      });
      ffmpeg = inst; loaded = true; return;
    } catch(e){ console.error('load failed via', lib, e); lastErr = e; }
  }
  throw lastErr;
}

async function run(){
  busy = true; go.disabled = true; zipBtn.disabled = true;
  try { await init(); }
  catch(e){ console.error(e); msg.textContent = 'Не удалось загрузить конвертер: ' + (e && e.message ? e.message : e) + '. Обновите страницу (Ctrl+F5) и попробуйте снова.'; busy=false; go.disabled=false; return; }

  const { fetchFile } = FFmpegUtil;
  let current = null;
  ffmpeg.on('progress', ({progress}) => {
    if (current) current.bar.value = Math.min(100, Math.max(0, Math.round(progress*100)));
  });

  let ok = 0, fail = 0;
  for (const q of queue){
    if (q.blob) continue;
    current = q;
    q.bar.hidden = false; q.bar.value = 0;
    q.st.className = 'st'; q.st.textContent = 'Конвертация…';
    msg.textContent = 'Идёт конвертация…';
    const ext = (q.file.name.match(/\.[^.]+$/) || ['.mp4'])[0];
    const inName = 'input' + ext, outName = 'output.mp3';
    try {
      await ffmpeg.writeFile(inName, await fetchFile(q.file));
      const code = await ffmpeg.exec(['-i', inName, '-vn', '-map_metadata', '0',
        '-c:a', 'libmp3lame', '-b:a', '320k', '-id3v2_version', '3', outName]);
      if (code !== 0) throw new Error('ffmpeg вернул код ' + code);
      const data = await ffmpeg.readFile(outName);
      q.blob = new Blob([data.buffer], {type:'audio/mpeg'});
      const url = URL.createObjectURL(q.blob);
      q.st.className = 'st ok';
      q.st.innerHTML = '<a class="dl" download>Скачать</a>';
      const a = q.st.querySelector('a'); a.href = url; a.download = q.outName;
      q.bar.value = 100; ok++;
    } catch(e){
      console.error(e);
      q.st.className = 'st bad'; q.st.textContent = 'Ошибка'; q.bar.hidden = true; fail++;
    }
    try { await ffmpeg.deleteFile(inName); } catch(_){}
    try { await ffmpeg.deleteFile(outName); } catch(_){}
  }
  current = null;
  msg.textContent = `Готово. Сконвертировано: ${ok}, с ошибками: ${fail}.`;
  busy = false;
  go.disabled = !queue.some(q => !q.blob);
  zipBtn.disabled = !queue.some(q => q.blob);
}

go.addEventListener('click', run);

zipBtn.addEventListener('click', async () => {
  const zip = new JSZip(), used = new Set();
  for (const q of queue){
    if (!q.blob) continue;
    let n = q.outName, i = 1;
    while (used.has(n)) n = q.outName.replace(/\.mp3$/, ` (${i++}).mp3`);
    used.add(n); zip.file(n, q.blob);
  }
  const blob = await zip.generateAsync({type:'blob', compression:'STORE'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'mp3.zip'; a.click();
});
</script>
</body>
</html>
